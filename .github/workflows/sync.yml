name: 同步插件索引

# 每次运行：读各插件仓库的最新 Release → 取其中的 index-entries.json →
# 重建 index.json → 内容有变化才 seq+1、签名、提交、发 Release。
#
# index.json 与 index.json.sig 挂在 tag 为 seq-<N> 的 Release 上，客户端用
# releases/latest/download/index.json 拉最新的那份。

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 每小时看一眼各插件仓库有没有新 Release
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出索引仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 从各插件仓库重建索引
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/sync.py --config plugins.json --index index.json \
            --summary "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            seq=$(python3 -c 'import json; print(json.load(open("index.json"))["seq"])')
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "seq=${seq}" >> "$GITHUB_OUTPUT"
          fi

      - name: 用离线私钥签名
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${INDEX_SIGNING_KEY:-}" ]; then
            echo "::error::缺 secret INDEX_SIGNING_KEY（内容就是 pfm plugin keygen 写出的私钥文件）"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/index.key"
          printf '%s' "$INDEX_SIGNING_KEY" > "$key"
          expect=$(python3 -c 'import json; print(json.load(open("plugins.json")).get("signing_public_key", ""))')
          python3 scripts/sign.py index.json --key "$key" --expect-public-key "$expect"
          rm -f "$key"

      - name: 提交并推送
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          SEQ: ${{ steps.sync.outputs.seq }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json index.json.sig
          git commit -m "索引同步：seq ${SEQ}"
          git pull --rebase --autostash
          git push

      - name: 发布索引 Release
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEQ: ${{ steps.sync.outputs.seq }}
        run: |
          set -euo pipefail
          tag="seq-${SEQ}"
          notes=$(printf '索引 seq %s\n\n- `index.json`：签名索引\n- `index.json.sig`：ed25519 签名（覆盖 index.json 原始字节）\n\n客户端默认地址：`https://github.com/%s/releases/latest/download/index.json`\n' "$SEQ" "$GITHUB_REPOSITORY")
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" index.json index.json.sig --clobber
          else
            gh release create "$tag" index.json index.json.sig \
              --title "索引 seq ${SEQ}" \
              --latest \
              --notes "$notes"
          fi
